<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &mdash; MediShelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2328A9C9'/><path d='M14 8h4v6h6v4h-6v6h-4v-6H8v-4h6z' fill='white'/></svg>">
</head>
<body class="login-page">

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="login-wrap">
  <div class="login-card glass">

    <div class="brand login-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="15" rx="4" fill="white" opacity=".95"/><path d="M9 6V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V6" stroke="white" stroke-width="2" stroke-linecap="round"/><path d="M12 10.5v6M9 13.5h6" stroke="#28A9C9" stroke-width="2.2" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text">
        <h1>Medi<span>Shelf</span></h1>
        <p>Pharmacy Inventory</p>
      </div>
    </div>

    <h2 class="login-title">Sign in to your panel</h2>
    <p class="login-sub">Pharmacy and distributor accounts use the same login.</p>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="pharmacy">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
    </div>

    <p class="login-error" id="loginError" hidden></p>

    <button class="btn-primary btn-block" id="loginBtn">
      Sign In
      <svg viewBox="0 0 24 24" class="ico"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
    </button>

    <div class="demo-box">
      <p class="demo-title">Demo accounts &mdash; click to fill</p>
      <div class="demo-row">
        <button class="demo-chip" data-u="pharmacy" data-p="pharma123">
          <b>Pharmacy</b><span>pharmacy / pharma123</span>
        </button>
        <button class="demo-chip" data-u="distributor" data-p="dist123">
          <b>Distributor</b><span>distributor / dist123</span>
        </button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="mock-cases-data.js"></script>
<script src="mock-backend.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  // Already signed in? Go straight to the right panel.
  var existing = MediAuth.user();
  if (MediAuth.token() && existing) location.href = existing.panel;

  function showError(msg) {
    var el = $("loginError");
    el.textContent = msg;
    el.hidden = false;
  }

  function signIn() {
    var username = $("username").value.trim();
    var password = $("password").value;
    if (!username || !password) { showError("Enter both a username and a password."); return; }

    $("loginError").hidden = true;
    var btn = $("loginBtn");
    btn.disabled = true;
    btn.textContent = "Signing in\u2026";

    MediAuth.login(username, password)
      .then(function (data) {
        MediAuth.save(data.token, data.user);
        location.href = data.user.panel;
      })
      .catch(function (e) {
        showError(e.message || "Could not sign in.");
        btn.disabled = false;
        btn.innerHTML = 'Sign In <svg viewBox="0 0 24 24" class="ico"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>';
      });
  }

  $("loginBtn").addEventListener("click", signIn);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") signIn();
  });

  document.querySelectorAll(".demo-chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      $("username").value = chip.dataset.u;
      $("password").value = chip.dataset.p;
      $("loginError").hidden = true;
    });
  });
})();
</script>
</body>
</html>
